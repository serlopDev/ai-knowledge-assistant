name: ai-knowledge-assistant

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only: the database is not reachable from the network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 images store data under /var/lib/postgresql/<major>/,
      # so the volume is mounted on the parent directory.
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Planned services, added in later phases:
  #   ai-service  (Python + FastAPI)  - Phase 3
  #   api         (NestJS)            - Phase 2
  #   web         (Vue 3 + Vite)      - Phase 4

volumes:
  pgdata:
